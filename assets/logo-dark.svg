<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Chart icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#g1)"/>

    <polyline
      points="18,72 32,58 46,64 60,42 74,36 88,20"
      fill="none"
      stroke="white"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <circle cx="18" cy="72" r="4" fill="white"/>
    <circle cx="32" cy="58" r="4" fill="white"/>
    <circle cx="46" cy="64" r="4" fill="white"/>
    <circle cx="60" cy="42" r="4" fill="white"/>
    <circle cx="74" cy="36" r="4" fill="white"/>
    <circle cx="88" cy="20" r="4" fill="white"/>

    <line x1="74" y1="36" x2="88" y2="20" stroke="white" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>
    <path d="M82,28 L88,20 L94,28" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text: Demand Signal Kit -->
  <text x="130" y="55" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">Demand Signal Kit</text>

  <!-- Tagline -->
  <text x="130" y="85" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#a5b4fc" letter-spacing="2">DEMAND FORECASTING TOOLKIT</text>
</svg>
