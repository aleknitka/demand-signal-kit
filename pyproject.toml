[project]
name = "demand-signal-kit"
version = "0.1.0"
description = "Extensible demand forecasting toolkit with competing models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.0.0",
    "lightgbm>=4.0.0",
    "prophet>=1.1.0",
    "holidays>=0.40",
    "numpy>=1.26",
    "scipy>=1.12",
    "click>=8.1",
    "pyarrow>=15.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "scikit-learn>=1.9.0",
    "streamlit[dashboard]>=1.58.0",
    "plotly[dashboard]>=6.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.20",
]

[project.scripts]
demand-signal-kit = "demand_signal_kit.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_signal_kit"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
